<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#0b0d12">
    <!-- CSP: راجع الشرح في index.html -->
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self';
        script-src 'self' https://www.gstatic.com;
        style-src 'self' https://fonts.googleapis.com;
        font-src https://fonts.gstatic.com;
        img-src 'self' data: https://www.google.com;
        connect-src https://firestore.googleapis.com https://*.googleapis.com
                    http://127.0.0.1:8080;
        base-uri 'none';
        form-action 'none'">
    <title>جاري التحويل…</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="./shared.css">
    <link rel="stylesheet" href="./redirect.css">
</head>
<body>
    <!--
      هذه الصفحة بوابة كل الروابط الفرعية، لا صفحة خطأ فحسب.

      GitHub Pages موقع ثابت بلا توجيه من الخادم: أي طلب لمسار غير موجود
      كملف — وكل روابط QR الفرعية كذلك — يُخدَم من 404.html. لذلك تبدأ
      الصفحة بمحاولة التحويل، ولا تُعرض واجهة "غير موجود" إلا بعد فشل
      البحث فعلًا.
    -->

    <svg class="sprite" aria-hidden="true">
        <symbol id="i-alert" viewBox="0 0 24 24">
            <path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/>
        </symbol>
        <symbol id="i-check" viewBox="0 0 24 24">
            <path d="m20 6-11 11-5-5"/>
        </symbol>
        <symbol id="i-home" viewBox="0 0 24 24">
            <path d="m3 10 9-7 9 7v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/><path d="M9 22V12h6v10"/>
        </symbol>
        <symbol id="i-sliders" viewBox="0 0 24 24">
            <path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/>
        </symbol>
    </svg>

    <div class="state" id="loading" role="status" aria-live="polite">
        <div class="spinner" aria-hidden="true"></div>
        <h1>جاري التحويل</h1>
        <p id="status">يرجى الانتظار</p>
    </div>

    <div class="state" id="failure" hidden role="alert">
        <span class="failure-mark" aria-hidden="true">
            <svg class="icon"><use href="#i-alert"/></svg>
        </span>
        <span class="code">404</span>
        <h1>الرابط غير متاح</h1>
        <p id="failure-message"></p>

        <div class="buttons">
            <a href="./" class="btn btn-quiet">
                <svg class="icon" aria-hidden="true"><use href="#i-home"/></svg>
                الصفحة الرئيسية
            </a>
            <a href="./admin.html" class="btn btn-quiet">
                <svg class="icon" aria-hidden="true"><use href="#i-sliders"/></svg>
                لوحة التحكم
            </a>
        </div>

        <div class="suggestions">
            <h2>احتمالات</h2>
            <ul>
                <li><svg class="icon" aria-hidden="true"><use href="#i-check"/></svg>الرابط غير مُنشأ في لوحة التحكم بعد</li>
                <li><svg class="icon" aria-hidden="true"><use href="#i-check"/></svg>الرابط مُنشأ لكنه معطَّل مؤقتًا</li>
                <li><svg class="icon" aria-hidden="true"><use href="#i-check"/></svg>الاسم حسّاس لحالة الأحرف: link1 ليست Link1</li>
            </ul>
        </div>

        <p class="footer">QR Redirect • Firebase &amp; GitHub Pages</p>
    </div>

    <script type="module" src="./redirect-page.js"></script>
</body>
</html>
