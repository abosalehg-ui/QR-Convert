<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <!-- CSP: تقصر تنفيذ السكربتات على ملفات الموقع نفسه و Firebase SDK من
         نطاق Google، فتحدّ من أثر أي XSS مستقبلي (البند 12).
         www.google.com في img-src يلزم لصورة فحص الاتصال التي يحمّلها نقل
         Firestore (WebChannel).
         ملاحظة: frame-ancestors لا تعمل من وسم meta وتحتاج ترويسة خادم،
         وGitHub Pages لا يسمح بترويسات مخصصة. -->
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self';
        script-src 'self' https://www.gstatic.com;
        style-src 'self';
        img-src 'self' data: https://www.google.com;
        connect-src https://firestore.googleapis.com https://*.googleapis.com
                    http://127.0.0.1:8080;
        base-uri 'none';
        form-action 'none'">
    <title>جاري التحويل...</title>
    <link rel="stylesheet" href="./shared.css">
    <link rel="stylesheet" href="./redirect.css">
</head>
<body>
    <!-- حالة التحميل -->
    <div class="state" id="loading" role="status" aria-live="polite">
        <div class="spinner" aria-hidden="true"></div>
        <h1>جاري التحويل...</h1>
        <p id="status">يرجى الانتظار</p>
    </div>

    <!-- حالة الفشل: تظهر فقط إذا تعذّر التحويل -->
    <div class="state" id="failure" hidden role="alert">
        <div class="error-emoji" aria-hidden="true">⚠️</div>
        <h1>تعذّر التحويل</h1>
        <p id="failure-message"></p>
        <p>يرجى التواصل مع المسؤول.</p>
    </div>

    <script type="module" src="./redirect-page.js"></script>
</body>
</html>
