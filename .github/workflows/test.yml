# يشغّل الاختبارات الثلاث على كل push وطلب دمج.
#
# بدون هذا كانت الاختبارات تعتمد على ذاكرة المطوّر — وغياب الاختبار هو ما
# سمح سابقًا بوصول عطل التحويل إلى الإنتاج.

name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: الدوال الخالصة
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  rules:
    name: قواعد Firestore
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run test:rules

  e2e:
    name: المتصفح
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
